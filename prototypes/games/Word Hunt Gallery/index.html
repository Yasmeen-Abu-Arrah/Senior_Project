<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Hunt Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #game-container {
      box-shadow: 0 14px 45px rgba(0,0,0,0.7);
      border-radius: 6px;
      overflow: hidden;
    }
    /* Crosshair cursor handled by Phaser — hide native cursor */
    #game-container canvas { cursor: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script src="game.js"></script>
</body>
</html>
